name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Every scene's shader compiles and draws a frame in headless Chrome (software WebGL).
      - name: Shader smoke test
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          curl -sf --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:4173/
          npm run smoke -- --base http://127.0.0.1:4173
